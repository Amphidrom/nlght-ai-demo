[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nlght-ai-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "nlght-ai[docker,hive-mind]",
]

[project.scripts]
nlght-ai-demo = "main:run"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-data]
showcase = ["static/*.html", "static/*.css", "static/*.js"]
