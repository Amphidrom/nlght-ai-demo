[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nlght-ai-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Requires the canonical-message and action-semantics APIs: typed
    # TrustedInstruction/UserMessage/ContextRecord prompts, and mandatory
    # action semantics on every tool signature (both 0.1.3), sampling
    # temperature as model provider configuration, and tool results that
    # carry their content origin (both 0.1.4).
    "nlght-ai[docker,hive-mind]>=0.1.4",
]

[project.optional-dependencies]
# The Knowledge Base case only. Reviewed claims are found by identity in
# PostgreSQL and by keyword in OpenSearch, so this needs the lexical store and
# neither a vector store nor an embedding provider — which is what keeps torch
# out of the default install.
knowledge = [
    "nlght-ai[lexical-store]",
]

[project.scripts]
nlght-ai-demo = "main:run"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-data]
showcase = ["static/*.html", "static/*.css", "static/*.js"]
knowledge_base = ["corpus/*.md"]
among_us = ["egos/*.toml", "protocol_fixtures/*.json"]
